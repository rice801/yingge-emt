<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鶯歌義消救護分隊協勤統計</title>
<script>var gsiOk=false;function gsiReady(){gsiOk=true;if(window.renderG)renderG()}</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gsiReady()"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--bd:#e3e6ec;--ac:#c62828;--ac2:#1565c0;--hi:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8eaee;--mut:#9aa3b2;--bd:#2d3440;--ac:#ef5350;--ac2:#64b5f6;--hi:#3a2326;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.ctr{text-align:center;padding:28px 14px}.ctr #gbtn{display:flex;justify-content:center;margin-top:14px}
.f{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select,button{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.k div{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
.k b{display:block;font-size:22px;color:var(--ac)}.k span{font-size:12px;color:var(--mut)}
.s{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{color:var(--mut);font-weight:600;cursor:pointer;user-select:none}
tr.sp td{background:var(--hi)}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px}
.bar{flex:1;min-width:8px;background:var(--ac2);border-radius:3px 3px 0 0}
.bl{display:flex;gap:3px;font-size:10px;color:var(--mut)}.bl span{flex:1;min-width:8px;text-align:center;overflow:hidden}
.note{font-size:12px;color:var(--mut)}
</style></head><body>

<div class="w" id="gate">
  <h1>鶯歌義消救護分隊協勤統計</h1>
  <div class="card ctr" id="gc">
    <div id="gmsg">請使用 maindata 登記的 Google 帳號登入</div>
    <div id="gbtn"></div>
  </div>
</div>

<div class="w" id="app" style="display:none">
<div class="top"><div><h1>鶯歌義消救護分隊協勤統計</h1><div class="sub" id="who"></div></div>
<div><button id="rf">重新整理資料</button> <button id="lo">登出</button></div></div>
<div class="sub" id="meta"></div>

<div class="card"><div class="f">
<label>起日<input type="date" id="d1"></label>
<label>迄日<input type="date" id="d2"></label>
<label id="nml">姓名<select id="nm"><option value="">全部</option></select></label>
<label>分類<select id="ct"><option value="">全部</option></select></label>
<button id="m">本月</button><button id="rs">重設</button>
</div></div>

<div class="card"><div class="k" id="kp"></div></div>
<div class="card"><h2>每日協勤時數</h2><div class="bars" id="bars"></div><div class="bl" id="bl"></div></div>
<div class="card"><h2>人員統計 <span class="note">（點表頭排序）</span></h2><div class="s"><table id="tp"></table></div></div>
<div class="card"><h2>時數統計 <span class="note">（協勤／常訓／公差，單位：小時）</span></h2>
<p><button class="p" id="xl">匯出 Excel</button></p>
<div class="s"><table id="th"></table></div>
<p class="note">協勤＝分類為「協勤」的時數；公差＝分類含「公差」的時數；常訓＝<span id="tn"></span>。</p></div>
<div class="card"><h2>協勤明細</h2><div class="s"><table id="td"></table></div></div>
</div>

<script>
/* ===== 設定：部署後請填入 ===== */
const CONFIG={
  CLIENT_ID:'921001196647-vi6cfbvjuk2ofusvs7hhpodqf4v8rr2g.apps.googleusercontent.com',
  API_URL:'https://script.google.com/macros/s/AKfycby4oUy4oBaiYUZ8pAbbyzGCr5589E1RG8dYg3QPXK1mGK_AO9dtF1_c6g77pMBXfuP2vQ/exec'
};
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=sessionStorage.getItem('tk')||'',ME=null,rows=[],ROSTER=[],TR=[],RS=new Set();

/* ===== 登入 ===== */
function gate(msg,btn){$('app').style.display='none';$('gate').style.display='';$('gmsg').innerHTML=msg;$('gbtn').style.display=btn?'flex':'none'}
function renderG(){
  if(/YOUR_/.test(CONFIG.CLIENT_ID)){$('gmsg').innerHTML='尚未設定 CLIENT_ID，請編輯 index.html 最上方的 CONFIG。';return}
  google.accounts.id.initialize({client_id:CONFIG.CLIENT_ID,callback:r=>{TOKEN=r.credential;sessionStorage.setItem('tk',TOKEN);load()}});
  google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',locale:'zh-TW',text:'signin_with'});
}
if(gsiOk)renderG();
setTimeout(()=>{if(!TOKEN&&!$('gbtn').children.length&&$('gate').style.display!='none'&&!/YOUR_/.test(CONFIG.CLIENT_ID))$('gmsg').innerHTML+='<br><span class="note">登入按鈕未載入：請確認可連線到 accounts.google.com、暫時關閉廣告攔截擴充功能，並檢查 CLIENT_ID 與授權來源（網址需完全相符）。</span>'},4000);
function logout(msg){
  TOKEN='';sessionStorage.removeItem('tk');ME=null;
  try{google.accounts.id.disableAutoSelect()}catch(e){}
  gate(msg||'已登出。請使用 maindata 登記的 Google 帳號登入',true);
}
async function load(){
  gate('資料載入中…',false);
  let d;
  try{const r=await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify({token:TOKEN})});d=await r.json()}
  catch(e){gate('連線失敗，請稍後再試。<br><button onclick="load()">重試</button> <button onclick="logout()">登出</button>',false);return}
  if(d.error=='unauthorized'){logout('登入已逾時，請重新登入');return}
  if(d.error=='forbidden'){gate('帳號 <b>'+esc(d.email)+'</b> 不在授權名單中。<br>請聯絡管理員確認 maindata 是否已登記您的 Gmail。<br><button onclick="logout()">改用其他帳號</button>',false);return}
  if(d.error){gate('伺服器錯誤：'+esc(d.message||d.error)+'<br><button onclick="load()">重試</button>',false);return}
  ME=d.me;rows=d.rows;ROSTER=d.roster;TR=d.trainings;RS=new Set(ROSTER.map(x=>x[1]));
  $('gate').style.display='none';$('app').style.display='';
  $('who').textContent='登入：'+ME.name+'（'+ME.email+'）｜權限：'+(ME.role=='admin'?'管理員（可查看全部人員）':'一般使用者（僅查看自己的統計）');
  $('nml').style.display=ME.role=='admin'?'':'none';
  init();
}
$('lo').onclick=()=>logout();
$('rf').onclick=()=>load();
if(TOKEN)load();

/* ===== 統計 ===== */
const tm=v=>v&&v.length>=4?v.slice(0,2)+':'+v.slice(2):v;
let sortK='h',sortD=-1,TLG=[];
function setMonth(){const T=new Date(),t0=T.getFullYear()+'-'+String(T.getMonth()+1).padStart(2,'0'),last=rows.map(r=>r.d).sort().pop()||'';const ym=rows.some(r=>r.d.startsWith(t0))?t0:(last.slice(0,7)||t0);const p=ym.split('-');$('d1').value=ym+'-01';$('d2').value=ym+'-'+String(new Date(+p[0],+p[1],0).getDate()).padStart(2,'0')}
function fill(id,arr){const el=$(id),f=el.options[0].outerHTML;el.innerHTML=f+[...new Set(arr)].sort().map(x=>`<option>${esc(x)}</option>`).join('')}
function init(){setMonth();fill('nm',ROSTER.map(r=>r[1]));fill('ct',rows.map(r=>r.ct));draw()}
function draw(){
  const a=$('d1').value,b=$('d2').value,nm=$('nm').value,ct=$('ct').value;
  const R=rows.filter(r=>RS.has(r.nm)&&(!a||r.d>=a)&&(!b||r.d<=b)&&(!nm||r.nm==nm)&&(!ct||r.ct==ct));
  $('meta').textContent=`共 ${rows.length} 筆，符合條件 ${R.length} 筆；統計名單 ${ROSTER.length} 人`;
  const S=k=>R.reduce((x,r)=>x+r[k],0);
  const kp=[['協勤人次',R.length],['總時數',S('h')],['出勤次數',S('t')],['載送人次',S('c')],['OHCA',S('o')],['ALS',S('a')],['BLS',S('b')],['協勤人數',new Set(R.map(r=>r.nm)).size]];
  $('kp').innerHTML=kp.map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
  const D={};R.forEach(r=>D[r.d]=(D[r.d]||0)+r.h);const dk=Object.keys(D).sort(),mx=Math.max(1,...Object.values(D));
  $('bars').innerHTML=dk.map(k=>`<div class="bar" style="height:${D[k]/mx*100}%" title="${k}：${D[k]} 小時"></div>`).join('');
  $('bl').innerHTML=dk.map(k=>`<span>${+k.slice(8)}</span>`).join('');
  const P={};ROSTER.forEach(m=>{if(!nm||nm==m[1])P[m[1]]={nm:m[1],ti:m[0],n:0,h:0,t:0,c:0,o:0,a:0,b:0}});
  R.forEach(r=>{const p=P[r.nm];if(!p)return;p.n++;['h','t','c','o','a','b'].forEach(k=>p[k]+=r[k])});
  const PL=Object.values(P).sort((x,y)=>(sortK=='nm'||sortK=='ti')?sortD*String(x[sortK]).localeCompare(String(y[sortK]),'zh-Hant'):sortD*(x[sortK]-y[sortK]));
  const H=[['nm','姓名'],['ti','職稱'],['n','次數'],['h','時數'],['t','出勤'],['c','載送'],['o','OHCA'],['a','ALS'],['b','BLS']];
  $('tp').innerHTML='<tr>'+H.map(x=>`<th data-k="${x[0]}">${x[1]}${sortK==x[0]?(sortD<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+PL.map(p=>'<tr>'+H.map(x=>`<td>${esc(p[x[0]])}</td>`).join('')+'</tr>').join('');
  $('tp').querySelectorAll('th').forEach(t=>t.onclick=()=>{const k=t.dataset.k;sortD=sortK==k?-sortD:-1;sortK=k;draw()});
  const TL=ROSTER.filter(m=>!nm||nm==m[1]).map(m=>{const L=R.filter(r=>r.nm==m[1]);
    const z=TR.reduce((s,t)=>s+((t.names.includes(m[1])&&(!a||a<=t.date)&&(!b||b>=t.date))?t.hours:0),0);
    return{nm:m[1],x:L.filter(r=>r.ct=='協勤').reduce((s,r)=>s+r.h,0),g:L.filter(r=>r.ct.includes('公差')).reduce((s,r)=>s+r.h,0),z}});
  TLG=TL;
  $('tn').textContent=TR.length?TR.map(t=>`${t.date.slice(5).replace('-','/')} 常訓 ${t.names.length} 人參加，每人 ${t.hours} 小時（統計區間含該日才計入）`).join('；'):'無常訓資料';
  const T=k=>TL.reduce((s,t)=>s+t[k],0);
  $('th').innerHTML='<tr><th class="l">姓名</th><th>協勤</th><th>常訓</th><th>公差</th></tr>'+TL.map(t=>`<tr><td>${esc(t.nm)}</td><td>${t.x}</td><td>${t.z}</td><td>${t.g}</td></tr>`).join('')+`<tr><td><b>合計</b></td><td><b>${T('x')}</b></td><td><b>${T('z')}</b></td><td><b>${T('g')}</b></td></tr>`;
  const RL=[...R].sort((x,y)=>y.d.localeCompare(x.d)||x.s.localeCompare(y.s));
  $('td').innerHTML='<tr><th class="l">日期</th><th class="l">姓名</th><th>到勤</th><th>退勤</th><th>時數</th><th>出勤</th><th>載送</th><th>OHCA</th><th>ALS</th><th>BLS</th><th class="l">分類</th></tr>'+
  RL.map(r=>`<tr class="${r.ct=='協勤'?'':'sp'}"><td>${r.d.slice(5).replace('-','/')}</td><td class="l">${esc(r.nm)}</td><td>${tm(r.s)}</td><td>${tm(r.e)}</td><td>${r.h}</td><td>${r.t}</td><td>${r.c}</td><td>${r.o}</td><td>${r.a}</td><td>${r.b}</td><td class="l">${esc(r.ct)}</td></tr>`).join('');
}
['d1','d2','nm','ct'].forEach(i=>$(i).onchange=draw);
$('rs').onclick=init;
$('m').onclick=()=>{setMonth();draw()};
$('xl').onclick=()=>{
  if(typeof XLSX=='undefined'){alert('Excel 元件載入失敗，請檢查網路。');return}
  const S=k=>TLG.reduce((s,t)=>s+t[k],0);
  const aoa=[['姓名','協勤','常訓','公差']].concat(TLG.map(t=>[t.nm,t.x,t.z,t.g]),[['合計',S('x'),S('z'),S('g')]]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:10},{wch:8},{wch:8},{wch:8}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'時數統計');
  XLSX.writeFile(wb,'時數統計_'+$('d1').value+'_'+$('d2').value+'.xlsx');
};
</script></body></html>
